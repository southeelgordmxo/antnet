name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Pipeline and operator tests
        run: |
          npm run test:pipeline
          npm run test:netlify
          node scripts/test-pdf.mjs
          node scripts/test-rendered-html.mjs
          node scripts/test-harvest.mjs
          node scripts/test-scout-activity.mjs

      - name: Postgres pipeline
        env:
          TEST_POSTGRES: "1"
        run: npm run test:pipeline
